name: Android
on:
  push:
    paths: ['apps/android/**', 'scripts/android-gradle.sh', 'Makefile', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'scripts/android-gradle.sh', 'Makefile', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - run: make build-android test-android lint-android
