name: Android
on:
  push:
    paths: ['apps/android/**', 'packages/design-tokens/**', 'scripts/android-gradle.sh', 'Makefile', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'packages/design-tokens/**', 'scripts/android-gradle.sh', 'Makefile', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmdline-tools;22.0"
          "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
      - run: make build-android test-android lint-android
