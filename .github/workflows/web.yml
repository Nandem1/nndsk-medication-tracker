name: Web
on:
  push:
    paths: ['apps/web/**', 'packages/design-tokens/**', 'services/api/**', 'packages/contracts/**', 'infrastructure/migrations/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['apps/web/**', 'packages/design-tokens/**', 'services/api/**', 'packages/contracts/**', 'infrastructure/migrations/**', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: medication_dev
          POSTGRES_PASSWORD: local_only_change_me
          POSTGRES_DB: medication_f3_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U medication_dev -d medication_f3_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://medication_dev:local_only_change_me@127.0.0.1:5432/medication_f3_ci?sslmode=disable
      TEST_DATABASE_URL: postgres://medication_dev:local_only_change_me@127.0.0.1:5432/medication_f3_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm install --global pnpm@12.15.0
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: make migrate-up
      - run: pnpm --dir apps/web lint && pnpm --dir apps/web test && pnpm --dir apps/web build
      - run: make test-web-e2e
