  "components": {
    "securitySchemes": {
      "firebase": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Firebase ID token"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "request_id": {
            "type": "string",
            "format": "uuid"
          },
          "details": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          }
        },
        "required": [
          "code",
          "message",
          "request_id",
          "details"
        ]
      },
      "Status": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok",
              "ready",
              "not_ready"
            ]
          }
        },
        "required": [
          "status"
        ]
      },
      "Slot": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "time": {
            "type": "string",
            "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          },
          "quantity": {
            "type": "string",
            "pattern": "^-?[0-9]+(?:\\.[0-9]{1,3})?$",
            "description": "Exact decimal units, never a JSON floating point number. Up to 9 integer and 3 fractional digits."
          }
        },
        "required": [
          "time",
          "quantity"
        ]
      },
      "Schedule": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "timezone": {
            "type": "string",
            "minLength": 1
          },
          "dst_policy": {
            "type": "string",
            "enum": [
              "reject",
              "next_valid_earliest"
            ]
          },
          "weekdays": {
            "type": "array",
            "items": {
              "type": "integer",
              "minimum": 0,
              "maximum": 6
            },
            "uniqueItems": true,
            "minItems": 1,
            "maxItems": 7
          },
          "slots": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Slot"
            },
            "minItems": 1,
            "maxItems": 24
          }
        },
        "required": [
          "timezone",
          "dst_policy",
          "weekdays",
          "slots"
        ]
      },
      "PatientAccess": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "patient_id": {
            "type": "string",
            "format": "uuid"
          },
          "link_id": {
            "anyOf": [
              {
                "type": "string",
                "format": "uuid"
              },
              {
                "type": "null"
              }
            ]
          },
          "scopes": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "read",
                "treatments",
                "doses",
                "inventory"
              ]
            }
          }
        },
        "required": [
          "patient_id",
          "link_id",
          "scopes"
        ]
      },
      "Me": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "user_id": {
            "type": "string",
            "format": "uuid"
          },
          "patients": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/PatientAccess"
            }
          },
          "next_cursor": {
            "type": "string"
          }
        },
        "required": [
          "user_id",
          "patients",
          "next_cursor"
        ]
      },
      "CreateTreatment": {
