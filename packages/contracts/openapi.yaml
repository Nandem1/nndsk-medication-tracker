      "delete": {
        "operationId": "deleteAccount",
        "description": "Deletes the authenticated account in one transaction: leaves shared inventories transferring the balance to those who stay, revokes links, and removes the actor's own patient history. Other patients' history stays; where the actor is an author, the user row is kept anonymized. Repeating the request is safe: no replay row is stored, because it would retain data of the removed account. Backups keep data until they expire, and deletions must be reapplied after a restore.",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
