    "/v1/patients/{patientId}/adherence": {
      "get": {
        "operationId": "getAdherence",
        "description": "Requires self or read scope. Local schedule dates [from,to), maximum 366 days. One transaction and as_of clock; materializes missing occurrences in 30-day chunks. Evaluable means scheduled_at strictly before as_of, excluding cancelled occurrences. Corrected current state is counted once. Adherence=(taken+taken_late)/evaluable; confirmation=(taken+taken_late+skipped)/evaluable; unconfirmed=pending/evaluable; punctuality=taken within inclusive +/- window_minutes of scheduled_at using current event occurred_at, divided by taken+taken_late. taken_late is never punctual. Rates are null when denominator is zero. Daily calendar uses original local schedule date, including zero-evaluable dates. Window is organizational, not medical advice.",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AdherenceReport"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "413": {
            "$ref": "#/components/responses/Error413"
          },
          "415": {
            "$ref": "#/components/responses/Error415"
          },
          "422": {
            "$ref": "#/components/responses/Error422"
          },
          "429": {
            "$ref": "#/components/responses/Error429"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          },
          "504": {
            "$ref": "#/components/responses/Error504"
          }
        },
        "parameters": [
          {
            "name": "patientId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "from",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "to",
