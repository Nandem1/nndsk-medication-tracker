name: MedicationTracker
options:
  bundleIdPrefix: dev.nndsk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  MedicationTracker:
    type: application
    platform: iOS
    sources:
      - path: MedicationTracker
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nndsk.MedicationTracker
        INFOPLIST_FILE: MedicationTracker/App/Info.plist
    dependencies:
      - sdk: libsqlite3.tbd
  MedicationTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MedicationTrackerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nndsk.MedicationTrackerTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MedicationTracker
  MedicationTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MedicationTrackerUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nndsk.MedicationTrackerUITests
        GENERATE_INFOPLIST_FILE: YES
        # XCUITest sigue siendo síncrono y atado al hilo principal; la app permanece en Swift 6 estricto.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TEST_TARGET_NAME: MedicationTracker
    dependencies:
      - target: MedicationTracker
schemes:
  MedicationTracker:
    build:
      targets:
        MedicationTracker: all
        MedicationTrackerTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - MedicationTrackerTests
  MedicationTrackerE2E:
    build:
      targets:
        MedicationTracker: all
        MedicationTrackerUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - MedicationTrackerUITests
